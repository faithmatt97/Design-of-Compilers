    <script type="text/javascript">
    // Global variables
    var tokens = [];

    var regID = new RegExp("[a-z]")

    var regIsEqual = new RegExp("==");

    function init() {

    function parse() {
        putMessage("Parsing [" + tokens + "]");
        // Grab the next token.
        currentToken = getNextToken();
        // A valid parse derives the G(oal) production, so begin there.
       
       // checkToken("boolval");

        putMessage("Parsing found " + errorCount + " error(s).");

        while(lexPtr < code.length){

                        addToken("TOKEN_BOOLTRUE", code.substring(lexPtr, lexPtr+4), 0, 0);

         //everything below here will be deleted but will keep for now to reference later if i need it lmao.
    function checkToken(expectedKind) {
        // Validate that we have the expected token kind and et the next token.
        switch(expectedKind) {
            case "type":   putMessage("Expecting Type");
                           if(currentToken == "i" && tokens.charAt(tokenIndex) == 'n' && tokens.charAt(tokenIndex+1) == 't')
                               putMessage("Got type");
            case "char":   putMessage("Expecting char. Current token is :" + currentToken );
                            var patt = new RegExp ("[a-z]");
                            if(patt.test(currentToken))
                                putMessage("Got char!");
                            else
                            {
                                errorCount++;
                                putMessage("NOT CHAR");
                            }
                            break;
            case "digit":   putMessage("Expecting a digit");
                            
                var res = regIsEqual("2 ==2")
                            putMessage(res +" WHER EU AT");
                            if (currentToken=="0" || currentToken=="1" || currentToken=="2" || 
                                currentToken=="3" || currentToken=="4" || currentToken=="5" || 
                                currentToken=="6" || currentToken=="7" || currentToken=="8" || 
                                currentToken=="9")
                            {
                                putMessage("Got a digit!");
                            }
                            else
                            {
                                errorCount++;
                                putMessage("NOT a digit.  Error at position " + tokenIndex + ".");
                            }
                            break;


            case "boolval" : putMessage("Expecting boolval");

                                putMessage("TokenIndex:" + tokens.charAt(tokenIndex-1) + " TokenIndex afterwards:" + tokens.charAt(tokenIndex+3));
                                //checks if match true
                             if(tokens.charAt(tokenIndex-1) == 't' 
                                && tokens.charAt(tokenIndex) == 'r' 
                                && tokens.charAt(tokenIndex+1) == 'u' 
                                && tokens.charAt(tokenIndex+2) == 'e'){
                                putMessage("Got Boolval!!!(true)");
                                tokenIndex = tokenIndex+3;
                        }
                                //checks if match false
                             else if(tokens.charAt(tokenIndex-1) == 'f' 
                                && tokens.charAt(tokenIndex) == 'a' 
                                && tokens.charAt(tokenIndex+1) == 'l' 
                                && tokens.charAt(tokenIndex+2) == 's' 
                                && tokens.charAt(tokenIndex+3) == 'e')
                             {
                                tokenIndex =tokenIndex+4;
                                putMessage("WE GOT A FALSE MATCH");
                             }

                            else
                            {
                                errorCount++;
                                putMessage("Not a boolval");
                            }
                            break;

            case "intop":      putMessage("Expecting an operator");
                            if (currentToken=="+")
                            {
                                putMessage("Got an operator!");
                            }
                            else
                            {
                                errorCount++;
                                putMessage("NOT an operator.  Error at position " + tokenIndex + ".");
                            }
                            break;


            default:        putMessage("Parse Error: Invalid Token Type at position " + tokenIndex + ".");
                            break;          
        }
        // Consume another token, having just checked this one, because that 
        // will allow the code to see what's coming next... a sort of "look-ahead".
        currentToken = getNextToken();
    }

    function getNextToken() {
        var thisToken = EOF;    // Let's assume that we're at the EOF.
        if (tokenIndex < tokens.length)
        {
            // If we're not at EOF, then return the next token in the stream and advance the index.
            thisToken = tokens[tokenIndex];
            putMessage("Current token:" + thisToken);
            tokenIndex++;
        }
        return thisToken;
    }
