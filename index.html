    <script type="text/javascript">
    // Global variables
    var tokens = [];
    var tokenIndex = 0;
    var currentToken = "";
    var errorCount = 0;
    var EOF = "$";
        

    var regStartComment = new RegExp('/\\*');
    var regEndComment = new RegExp('\\*/');
    var regEOF = new RegExp("\\$");

    var regLeftBrace = new RegExp('{');
    var regLeftParen = new RegExp("\\(");
    var regRightParen = new RegExp("\\)");
    var regRightBrace = new RegExp("}");


    var regBooleanFalse = new RegExp('false');
    var regBooleanTrue = new RegExp('true');
    var regWhile = new RegExp('while');;
    var regIf = new RegExp('if');
    
    var regWhiteSpace = new RegExp(' |\t|\r');
    var regPrint = new RegExp('print');
    var regID = new RegExp("[a-z]")
    var regDigit = new RegExp("[0-9]")
    var regIntOp = new RegExp("\\+");
    var regAssign = new RegExp(' = ');
    //var regSpace = new RegExp('\n | \t ');
    var regNewLine = new RegExp('\n');
    var regIsNotEqual = new RegExp('!=');
    var regIsEqual = new RegExp("==");
    var regBoolType = new RegExp('boolean')
    var regIntType = new RegExp ('int');
    var regStringType = new RegExp('string');
    var code;
    var codeBody = document.getElementById("taOutput");

    var regQuote = new RegExp('"');


    var inQuotes = false;
    var inComment = false; 
        var tokenArray;

        var line ;
        var column ;
        
    function init() {
        // Clear the message box.
        console.clear();
        document.getElementById("taOutput").value = "";
        // Set the initial values for our globals.
        tokenArray= []; //kept getting some type error when it was named tokens
        tokenIndex = 0;
        lexPtr =0;
        currentToken = ' ';
        errorCount = 0; 
        warningCount = 0;    


         line =1;
         column = 0;
    }
    
    function btnCompile_click() {        
        // This is executed as a result of the usr pressing the 
        // "compile" button between the two text areas, above.  
        // Note the <input> element's event handler: onclick="btnCompile_click();
        init();
     var codeBody = document.getElementById("taSourceCode").value;
        
      code= trim(codeBody);
                
        putMessage("Compilation Started");
        // Grab the tokens from the lexer . . .
        tokens = lex();
        putMessage("Lex returned [" + tokens + "]");
        // . . . and parse!
        parse();
        
        
    }
    
    function putMessage(msg) {
        document.getElementById("taOutput").value += msg + "\n";
    }
    
    
    function parse() {
        putMessage("Parsing [" + tokens + "]");
        // Grab the next token.
        currentToken = getNextToken();
        // A valid parse derives the G(oal) production, so begin there.
       
       // checkToken("boolval");
        // Report the results.
        putMessage("Parsing found " + errorCount + " error(s).");   
       
       
        
        tokenPtr = 0;

        var commentLine
        var commentCol

        while(lexPtr < code.length){

                        if(inComment){
                             if(regEndComment.test(code.substring(lexPtr, lexPtr+2)))
                             {
                                inComment = false;
                                lexPtr++;
                            }

                        }
                        else if(regStartComment.test(code.substring(lexPtr, lexPtr+2)))
                        {
                           inComment = true;
                           lexPtr++;
                           commentLine = line;
                           commentCol = column;
                        }
         
                    //Just focusing on chugging out tokens in console, will worry about lines, columns, and structural logic later
                    // Hey Code, buddy, pal, you wanna work some time?
                        else if(regWhiteSpace.test(code.charAt(lexPtr)))
                        {
                        }

                        else if(regLeftBrace.test(code.charAt(lexPtr)))
                        {
                            addToken("TOKEN_LEFTBRACE", "{", line, column);
                            console.log(tokenArray[tokenArray.length-1])
                        }

                        else if(regLeftParen.test(code.charAt(lexPtr)))
                        {
                            addToken("TOKEN_LEFTPAREN", "(", line, column);
                            console.log(tokenArray[tokenArray.length-1])
                        }

                        else if(regRightBrace.test(code.charAt(lexPtr)))
                        {
                            addToken("TOKEN_RIGHTBRACE", "}", line, column);
                            console.log(tokenArray[tokenArray.length-1])
                        }

                        else if(regRightParen.test(code.charAt(lexPtr)))
                        {
                            addToken("TOKEN_RIGHTPAREN", ")", line, column);
                            console.log(tokenArray[tokenArray.length-1])
                        }

                         else if(regEOF.test(code.charAt(lexPtr))){
                           console.log("Finished lexing this program");
                        }
                   

                    // TRUE TEST for now we just let the lexPtr skip ahead for tokens with lengths > 1. I'm sure there's a better way to do this but I wanna play some resident evil so LATER. 
                    else if(regQuote.test(code.charAt(lexPtr)))
                    {      
                        addToken("TOKEN_QUOTE", '"', line, column);
                        console.log(tokenArray[tokenArray.length-1])
                        

                        if(inQuotes)
                            inQuotes = false;
                        else 
                            inQuotes = true;
                           
                        
                        
                    }
                     else if(regBooleanTrue.test(code.substring(lexPtr, lexPtr+4 )))
                     {
                        addToken("TOKEN_BOOLTRUE", code.substring(lexPtr, lexPtr+4), line, column);
                        console.log(tokenArray[tokenArray.length-1])
                        lexPtr+=3;
                        column+=3;
                    }

                            // IF TEST
                    else if(regIf.test(code.substring(lexPtr, lexPtr+2)))
                    {
                        addToken("TOKEN_IF", code.substring(lexPtr, lexPtr+2), line, column);
                        console.log(tokenArray[tokenArray.length-1])
                        lexPtr++;
                        column++;
                    }
                            //WHILE TEST
                    else if(regWhile.test(code.substring(lexPtr, lexPtr+5)))
                    {
                        addToken("TOKEN_WHILE", code.substring(lexPtr, lexPtr+5), line, column);
                        console.log(tokenArray[tokenArray.length-1])
                        lexPtr+=4;
                        column+=4;
                    }

                    else if(regPrint.test(code.substring(lexPtr, lexPtr+5)))
                    {
                        addToken("TOKEN_PRINT", code.substring(lexPtr, lexPtr+5), line, column);
                        console.log(tokenArray[tokenArray.length-1])
                        lexPtr+=3;
                        column+=3;
                    }

                         //FALSE TEST
                    else if(regBooleanFalse.test(code.substring(lexPtr, lexPtr+5 )))
                    {
                        addToken("TOKEN_BOOLFALSE", code.substring(lexPtr, lexPtr+5), line, column);
                        console.log(tokenArray[tokenArray.length-1])
                        lexPtr+=4;
                        column+=4;
                    }
                        // ID TEST
                    else if (regID.test(code.charAt(lexPtr))) 
                    {
                        if(inQuotes)
                        {
                            addToken("TOKEN_CHAR", code.charAt(lexPtr), line, column);
                            console.log(tokenArray[tokenArray.length-1])
                        }
                        else
                        {
                            addToken("TOKEN_ID", code.charAt(lexPtr), line, column);
                            console.log(tokenArray[tokenArray.length-1])
                        }
                    }
                        //DIGIT TEST
                    else if (regDigit.test(code.charAt(lexPtr))) 
                    {
                        addToken("TOKEN_DIGIT", code.charAt(lexPtr), line, column);
                        console.log(tokenArray[tokenArray.length-1])
                    }

                            //NEWLINE TEST. I don't need a token for this but it's there for testing purposes. Will increment some pointer here to keep track of lines while Coloumn pointer will reset to zero 
                    else if (regNewLine.test(code.charAt(lexPtr))) 
                    {
                        line++
                        column = -1;
                    }

                   else
                   {
                    errorCount++;
                    console.log("ERROR: Unexpected token '" + code.charAt(lexPtr) + "' at line:" + line + " , column:" + column);
                   }
          
           //console.log(tokenArray[tokenPtr]);
            lexPtr++;
            column++;
           // tokenPtr++;
        
            }



            /*for( i=0; i < tokenArray.length; i++)
            {
                console.log(tokenArray[tokenPtr])
                tokenPtr++;
            }*/

            if(inComment)
            {
                errorCount++;
                console.log("ERROR: no closing comment symbol at line:" + commentLine + " , column:" + commentCol);
            }

            console.log("LEXER FINISHED. Warnings: " + warningCount + " Errors:" + errorCount);
    }

         //everything below here will be deleted but will keep for now to reference later if i need it lmao.
    function checkToken(expectedKind) {
        // Validate that we have the expected token kind and et the next token.
        switch(expectedKind) {
            case "type":   putMessage("Expecting Type");
                           if(currentToken == "i" && tokens.charAt(tokenIndex) == 'n' && tokens.charAt(tokenIndex+1) == 't')
                               putMessage("Got type");
            case "char":   putMessage("Expecting char. Current token is :" + currentToken );
                            var patt = new RegExp ("[a-z]");
                            if(patt.test(currentToken))
                                putMessage("Got char!");
                            else
                            {
                                errorCount++;
                                putMessage("NOT CHAR");
                            }
                            break;
            case "digit":   putMessage("Expecting a digit");
                            
                var res = regIsEqual("2 ==2")
                            putMessage(res +" WHER EU AT");
                            if (currentToken=="0" || currentToken=="1" || currentToken=="2" || 
                                currentToken=="3" || currentToken=="4" || currentToken=="5" || 
                                currentToken=="6" || currentToken=="7" || currentToken=="8" || 
                                currentToken=="9")
                            {
                                putMessage("Got a digit!");
                            }
                            else
                            {
                                errorCount++;
                                putMessage("NOT a digit.  Error at position " + tokenIndex + ".");
                            }
                            break;


            case "boolval" : putMessage("Expecting boolval");

                                putMessage("TokenIndex:" + tokens.charAt(tokenIndex-1) + " TokenIndex afterwards:" + tokens.charAt(tokenIndex+3));
                                //checks if match true
                             if(tokens.charAt(tokenIndex-1) == 't' 
                                && tokens.charAt(tokenIndex) == 'r' 
                                && tokens.charAt(tokenIndex+1) == 'u' 
                                && tokens.charAt(tokenIndex+2) == 'e'){
                                putMessage("Got Boolval!!!(true)");
                                tokenIndex = tokenIndex+3;
                        }
                                //checks if match false
                             else if(tokens.charAt(tokenIndex-1) == 'f' 
                                && tokens.charAt(tokenIndex) == 'a' 
                                && tokens.charAt(tokenIndex+1) == 'l' 
                                && tokens.charAt(tokenIndex+2) == 's' 
                                && tokens.charAt(tokenIndex+3) == 'e')
                             {
                                tokenIndex =tokenIndex+4;
                                putMessage("WE GOT A FALSE MATCH");
                             }

                            else
                            {
                                errorCount++;
                                putMessage("Not a boolval");
                            }
                            break;

            case "intop":      putMessage("Expecting an operator");
                            if (currentToken=="+")
                            {
                                putMessage("Got an operator!");
                            }
                            else
                            {
                                errorCount++;
                                putMessage("NOT an operator.  Error at position " + tokenIndex + ".");
                            }
                            break;


            default:        putMessage("Parse Error: Invalid Token Type at position " + tokenIndex + ".");
                            break;          
        }
        // Consume another token, having just checked this one, because that 
        // will allow the code to see what's coming next... a sort of "look-ahead".
        currentToken = getNextToken();
    }

    function getNextToken() {
        var thisToken = EOF;    // Let's assume that we're at the EOF.
        if (tokenIndex < tokens.length)
        {
            // If we're not at EOF, then return the next token in the stream and advance the index.
            thisToken = tokens[tokenIndex];
            putMessage("Current token:" + thisToken);
            tokenIndex++;
        }
        return thisToken;
    }
